services:
  api:
    build:
      context: ../../backend-go
      dockerfile: Dockerfile
    container_name: philmymeds-api
    ports:
      - "8080:8080"
    env_file:
      - ../../.env  # Load .env from root directory
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/philmymeds?authSource=admin
      - PORT=${PORT:-8080}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - SHIPPO_API_KEY=${SHIPPO_API_KEY:-}
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - philmymeds-network

  mongodb:
    image: mongo:latest
    container_name: philmymeds-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - philmymeds-network

  postgres:
    image: postgres:latest
    container_name: philmymeds-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-philmymeds}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - philmymeds-network

networks:
  philmymeds-network:
    driver: bridge

volumes:
  mongodb_data:
  postgres_data:
