config:
  target: "http://localhost:3001"
  phases:
    # Capacity test - Direct 200 req/s load (no warm-up/ramp-up for true capacity)
    - duration: 120
      arrivalRate: 200
      name: "Direct 200 req/s capacity test"
  processor: "./artillery-processor.js"
  variables:
    seatCount: 150000

scenarios:
  # Scenario 1: Booking creation only (high rate)
  - name: "Booking Load Test"
    weight: 70
    flow:
      - function: "generateSeatsForRequest"
      - post:
          url: "/api/bookings"
          json:
            seat_ids: "{{ seatIds }}"
          capture:
            - json: "$.id"
              as: "bookingId"
              strict: false # Don't fail if field doesn't exist (409 responses won't have id)
          expect:
            - statusCode: [201, 202, 409] # 201 = direct mode success, 202 = kafka mode queued, 409 = seat conflict (expected)
            - contentType: json

  # Scenario 2: Full flow (booking + payment) - COMMENTED OUT FOR BOOKING-ONLY TESTING
