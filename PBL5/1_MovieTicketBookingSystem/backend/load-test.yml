  #     - post:
  #         url: "/api/bookings"
  #         json:
  #           seat_ids: "{{ seatIds }}"
  #         capture:
  #           - json: "$.id"
  #             as: "bookingId"
  #             strict: false # Don't fail if field doesn't exist (409 responses won't have id)
  #         expect:
  #           - statusCode: [201, 409]
  #
  #     # Step 2: Pay immediately (if booking succeeded)
  #     - post:
  #         url: "/api/payments/process"
  #         json:
  #           booking_id: "{{ bookingId }}"
  #           amount: 200
  #           payment_method: "credit_card"
  #         capture:
  #           - json: "$.payment_id"
  #             as: "paymentId"
  #             strict: false # Don't fail if field doesn't exist (error responses won't have payment_id)
  #         expect:
  #           - statusCode: [200, 400, 404] # 200 = success, 400/404 = booking not found/confirmed
  #         if:
  #           "{{ bookingId && bookingId !== '' }}"

  # Scenario 3: Multi-seat Atomicity Stress Test
  - name: "Atomic Multi-seat Locking Stress Test"
    weight: 15
    flow:
      # Generate seat sets that intentionally overlap
      - function: "generateAtomicitySeatSets"

      # Users aggressively try to book overlapping seats
      - post:
          url: "/api/bookings"
          json:
            seat_ids: "{{ atomicSeatIds }}"
          capture:
            - json: "$.id"
              as: "bookingId"
              strict: false
            - json: "$.unavailable_seats"
              as: "unavailableSeats"
              strict: false
          expect:
            - statusCode: [201, 202, 409] # 201 = direct mode success, 202 = kafka mode queued, 409 = conflict (expected for atomicity)
            - contentType: json
