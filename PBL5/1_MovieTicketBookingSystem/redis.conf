# Redis Performance Tuning Configuration

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
save 60 1000

# Network
tcp-keepalive 60

# Keyspace Notifications
# Enable expired key events for booking expiry handling
# 'Ex' means: E = keyevent events, x = expired events
notify-keyspace-events Ex

