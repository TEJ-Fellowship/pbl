version: "3.8"

services:
  # Go API Server
  api:
    build:
      context: ./backend-go
      target: api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=development
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DATABASE=pharmonico
      - POSTGRES_URI=postgres://postgres:postgres@postgres:5432/pharmonico?sslmode=disable
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=pharmonico
      - JWT_SECRET=dev-secret-change-in-production
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - pharmonico-network
    restart: unless-stopped

  # Go Worker
  worker:
    build:
      context: ./backend-go
      target: worker
    environment:
      - ENVIRONMENT=development
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DATABASE=pharmonico
      - POSTGRES_URI=postgres://postgres:postgres@postgres:5432/pharmonico?sslmode=disable
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - pharmonico-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend-react
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-react:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    networks:
      - pharmonico-network
    restart: unless-stopped

  # MongoDB
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./scripts/seeds/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pharmonico-network
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pharmonico
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/seeds/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pharmonico-network
    restart: unless-stopped

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - pharmonico-network
    restart: unless-stopped

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/pharmonico --ignore-existing;
      mc anonymous set download myminio/pharmonico;
      exit 0;
      "
    networks:
      - pharmonico-network

  # Maildev (Email testing)
  maildev:
    image: maildev/maildev:2.1.0
    ports:
      - "1080:1080"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - pharmonico-network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional - uncomment to use)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - api
  #     - frontend
  #   networks:
  #     - pharmonico-network
  #   restart: unless-stopped

volumes:
  mongodb-data:
  postgres-data:
  minio-data:

networks:
  pharmonico-network:
    driver: bridge

